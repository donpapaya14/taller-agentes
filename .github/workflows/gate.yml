# Gate de calidad: cada puerta deja su informe y scripts/puertas/informe-gate.mjs decide.
#
#   gate rápido    cada push a la rama principal y cada pull request
#   gate completo  a mano (Actions → Gate → Run workflow). Es el único camino a producción.
#
# El veredicto no lo da ningún paso suelto: cada puerta deja su informe en reports/gate y
# scripts/puertas/informe-gate.mjs decide. Una puerta requerida que no deja informe cuenta como
# FALLO, salvo que calidad.json la tenga en `omitir` con su motivo.
#
# Seguridad del propio workflow: solo push, pull_request y workflow_dispatch (nunca schedule),
# permisos de solo lectura y ningún dato del evento interpolado dentro de un `run:`.
name: Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      desplegar:
        description: Desplegar a producción si el gate completo sale en verde
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NIVEL: ${{ github.event_name == 'workflow_dispatch' && 'completo' || 'rapido' }}
  DIR: reports/gate
  PUERTAS: scripts/puertas
  REF_BASE_PR: ${{ github.base_ref }}
  SHA_ANTERIOR: ${{ github.event.before }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Las acciones van fijadas por el SHA del commit de su versión (la versión, en el comentario):
      # una etiqueta se puede mover y un SHA no. Dependabot propone las subidas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Versión fija y no la de .nvmrc: las puertas usan fs.globSync, que no existe en Node 20.
      # Es la misma línea mayor con la que check:full corre en la Mac.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Con qué se compara: la rama destino en un PR, el commit anterior en un push y, si no lo
      # hay (rama nueva, lanzamiento a mano), el primer commit del repo.
      - name: Calcular la base
        run: |
          base=""
          if [ -n "$REF_BASE_PR" ]; then
            base="origin/$REF_BASE_PR"
          elif [ -n "$SHA_ANTERIOR" ] && git cat-file -e "$SHA_ANTERIOR^{commit}" 2> /dev/null; then
            base="$SHA_ANTERIOR"
          else
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          mkdir -p "$DIR" reports

      # --- Puertas del proyecto: scripts de package.json con nombre fijo ----------------------
      - name: lint
        run: node "$PUERTAS/run-check.mjs" lint --out "$DIR" -- npm run lint

      - name: tests y cobertura
        run: node "$PUERTAS/run-check.mjs" tests --out "$DIR" -- npm run cobertura

      - name: spec
        run: node "$PUERTAS/run-check.mjs" spec --out "$DIR" -- npm run spec:check

      - name: arquitectura
        run: node "$PUERTAS/run-check.mjs" arquitectura --out "$DIR" -- npm run arquitectura

      - name: duplicado
        run: node "$PUERTAS/run-check.mjs" duplicado --out "$DIR" -- npm run duplicado

      - name: muerto
        run: node "$PUERTAS/run-check.mjs" muerto --out "$DIR" -- npm run muerto

      # --- Puertas de la casa: comparan la base con HEAD --------------------------------------
      # `|| true`: estos scripts salen con 1 cuando hay FALLO, pero el veredicto es del informe.
      - name: umbrales
        run: node "$PUERTAS/guarda-umbrales.mjs" --base "$BASE" --json "$DIR/umbrales.json" || true

      - name: manipulacion
        run: node "$PUERTAS/detector-manipulacion.mjs" --base "$BASE" --json "$DIR/manipulacion.json" || true

      - name: trinquete
        run: node "$PUERTAS/trinquete.mjs" --base "$BASE" --json "$DIR/trinquete.json" || true

      # --- Seguridad: herramientas externas, sin cuenta ni clave ------------------------------
      # Se descargan aparte y en silencio: el informe guarda las últimas 80 líneas de cada puerta
      # y el progreso de `docker pull` tapaba los hallazgos. Cada imagen lleva su versión, sin
      # `latest`: lo que revisa el gate hoy es lo que lo revisará dentro de seis meses. Dependabot
      # no ve estas líneas: las versiones se suben a mano.
      - name: Descargar imágenes de seguridad
        run: |
          docker pull -q ghcr.io/gitleaks/gitleaks:v8.30.1
          docker pull -q semgrep/semgrep:1.185.0
          docker pull -q ghcr.io/google/osv-scanner:v2.7.1

      - name: secretos (gitleaks)
        run: >
          node "$PUERTAS/run-check.mjs" secretos --out "$DIR" --
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --no-banner --redact

      - name: sast (semgrep)
        run: >
          node "$PUERTAS/run-check.mjs" sast --out "$DIR" --
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.185.0
          semgrep scan --config p/default --error --quiet --metrics=off /src

      - name: dependencias (osv-scanner)
        run: >
          node "$PUERTAS/run-check.mjs" dependencias --out "$DIR" --
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.1
          scan source --lockfile /src/package-lock.json

      # --- Gate completo: Supabase local, usuarios de demostración y navegador ----------------
      # Los necesitan gate:e2e y gate:a11y (gate:rls usa PGlite). Las claves salen del
      # `supabase status` del propio runner: son las de esa base local, no un secreto del repo.
      # ANON_KEY y SERVICE_ROLE_KEY sirven de respaldo si la CLI no entrega las claves nuevas.
      # La CLI lleva versión fija, como las acciones y las imágenes: sin `version` la acción baja la
      # última, y una subida de la CLI cambiaría el gate sin tocar este archivo.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: env.NIVEL == 'completo'
        with:
          version: 2.122.1

      - name: Supabase local, usuarios de demostración y navegador
        if: env.NIVEL == 'completo'
        run: |
          supabase start
          supabase db reset
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          export DEMO_PASSWORD=demo-ci-local
          export CRON_SECRET=cron-ci-local
          for nombre in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY \
            DEMO_PASSWORD CRON_SECRET; do
            echo "$nombre=${!nombre}" >> "$GITHUB_ENV"
          done
          node scripts/crear-usuarios-demo.mjs
          npx playwright install --with-deps chromium

      # --- Puertas opcionales: corren si el repo define el script `gate:<id>` ------------------
      # tipos y rls en los dos niveles; el resto solo en el gate completo. Cuáles son requeridas
      # lo decide informe-gate según `tipo`, `supabase` y tsconfig.json.
      - name: puertas gate:<id>
        run: |
          ids="tipos rls"
          if [ "$NIVEL" = completo ]; then
            ids="$ids mutacion e2e dast cabeceras lighthouse a11y enlaces carga n8n"
          fi
          for id in $ids; do
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "gate:$id"; then
              node "$PUERTAS/run-check.mjs" "$id" --out "$DIR" -- npm run "gate:$id"
            fi
          done

      # --- Veredicto -------------------------------------------------------------------------
      - name: Informe del gate
        run: >
          node "$PUERTAS/informe-gate.mjs" --nivel "$NIVEL" --dir "$DIR"
          --calidad calidad.json --sha "$GITHUB_SHA"
          --salida gate-report.json --resumen "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-${{ github.sha }}
          path: |
            gate-report.json
            reports/gate
          if-no-files-found: warn
          retention-days: 30

  # Producción solo sale de aquí: gate completo en verde, lanzado a mano, desde la rama principal.
  # El entorno `produccion` guarda los secretos de despliegue; si el plan de GitHub lo permite,
  # ponle a Vladys como revisor obligatorio y el GATE 3 queda dentro de GitHub.
  desplegar:
    needs: gate
    if: >
      github.event_name == 'workflow_dispatch' && inputs.desplegar &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    # URL_BASE apunta el smoke al sitio publicado: es una variable del entorno `produccion`, no un
    # secreto, y la leen la comprobación y el smoke.
    env:
      URL_BASE: ${{ vars.URL_PRODUCCION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Sin la variable URL_PRODUCCION el smoke levantaría la app en el runner y daría por buena una
      # producción que nadie ha mirado: se corta antes de desplegar.
      - name: Comprobar la dirección de producción
        run: test -n "$URL_BASE" || { echo "::error::Falta la variable URL_PRODUCCION del entorno produccion"; exit 1; }
      # Los secretos de Vercel van solo en este paso, no en todo el job: así `npm ci`, el navegador y
      # el smoke no los ven. La CLI los lee del entorno, sin `--token` en la línea de comandos.
      - name: Desplegar
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run desplegar
      # El smoke es una prueba de Playwright: el runner de GitHub no trae el navegador.
      - name: Instalar el navegador del smoke
        run: npx playwright install --with-deps chromium
      # El smoke entra con la contraseña de la demo. Va solo en este paso, no en todo el job: así
      # `npm ci` y el despliegue no la ven.
      - name: Smoke de producción
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: npm run smoke
