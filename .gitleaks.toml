# Configuración gitleaks del repo. Extiende las reglas por defecto; solo excluye
# directorios generados que nunca se commitean (ya están en .gitignore).
[extend]
useDefault = true

[allowlist]
paths = [
  '''^\.next/''',
  '''^node_modules/''',
  '''^coverage/''',
  '''^reports/''',
  '''^\.stryker-tmp/''',
  '''^playwright-report/''',
  '''^test-results/''',
]
